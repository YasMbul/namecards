<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Nama - Gung May</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      max-width: 420px;
      width: 100%;
      border: 1px solid #e5e7eb;
      border-top: 5px solid hsl(124, 79%, 58%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 32px 28px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }
    .role {
      font-size: 14px;
      font-weight: 600;
      color: #72ee8f;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .bio {
      font-size: 14px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 24px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 20px;
    }
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #374151;
      text-decoration: none;
    }
    .contact-item:hover {
      color: #dc2626;
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      font-size: 11px;
      background-color: #f9fafb;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Tag Wajib TC-02 -->

    <div class="role">Informatika / IoT</div>

    <p class="bio">

    </p>

    <div class="contact-list">
      <a class="contact-item" href="mailto:gungmasmay@gmail.com">
        <strong>Email:</strong> gungmasmay@gmail.com
      </a>
      <a class="contact-item" href="https://github.com/gungmasmay" target="_blank" rel="noopener noreferrer">
        <strong>GitHub:</strong> github.com/gungmasmay
      </a>
      <a class="contact-item" href="www.linkedin.com/in/gungmasmay" target="_blank" rel="noopener noreferrer">

      </a>
